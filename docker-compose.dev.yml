# Sandbox: runs your working copy next to production without touching it.
#   docker compose -f docker-compose.dev.yml up -d --build
#   open http://localhost:8089
# Same layout as docker-compose.yml (unprivileged web interface, agent over a Unix socket, Docker
# socket proxy), plus a pretend remote server on https://localhost:8090 to pair with.
# Works on Docker Desktop too, where it monitors Docker's Linux VM.
name: gaugery-dev

services:
  gaugery-dev:
    build: .
    image: gaugery:dev
    container_name: gaugery-dev
    environment:
      ROLE: hub
      HUB_DB: /data/hub.db
      LOCAL_AGENT: unix:/run/gaugery/agent.sock
      AGENT_TOKEN: ${AGENT_TOKEN:?add AGENT_TOKEN to .env}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      NTFY_URL: ""   # never send phone alerts from the sandbox
    ports:
      - "127.0.0.1:8089:8088"
    volumes:
      - hub-data-dev:/data
      - agent-socket-dev:/run/gaugery
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    depends_on: [gaugery-dev-agent]

  gaugery-dev-agent:
    image: gaugery:dev
    container_name: gaugery-dev-agent
    environment:
      ROLE: agent
      AGENT_LISTEN: unix:/run/gaugery/agent.sock
      AGENT_SOCKET_GROUP: 10001
      AGENT_TOKEN: ${AGENT_TOKEN}
      HOST_ROOT: /host
      DB_PATH: /data/metrics.db
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_ACTIONS_HOST: tcp://docker-actions:2375
      ALLOW_LOGS: all
      ALLOW_CONTAINER_ACTIONS: all
      RETENTION_DAYS: 2
      NTFY_URL: ""
    volumes:
      - /:/host:ro
      - ./data-dev:/data
      - agent-socket-dev:/run/gaugery
    user: "0:0"
    pid: host
    read_only: true
    # The host's /run holds the control sockets of Docker, containerd, systemd and others.
    # A read-only mount doesn't stop connecting to a socket, so hide it: root here must not reach them.
    tmpfs: [/tmp, /host/run]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    networks: [default, docker-api]
    depends_on: [docker-proxy]

  # A pretend remote server: pair it on the overview with https://gaugery-agent:8088 and the
  # pairing code from `docker logs gaugery-dev-remote`.
  gaugery-agent:
    image: gaugery:dev
    container_name: gaugery-dev-remote
    environment:
      ROLE: agent
      AGENT_LISTEN: tcp
      AGENT_TOKEN: ${DEV_AGENT_TOKEN:?add DEV_AGENT_TOKEN to .env}
      HOST_ROOT: /host
      DB_PATH: /data/metrics.db
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_ACTIONS_HOST: tcp://docker-actions:2375
      ALLOW_LOGS: demo-web,gaugery-dev-remote
      ALLOW_CONTAINER_ACTIONS: demo-web
      ALERT_DISK_WARN: 1  # a low threshold so this server's card shows alerts (red) right away
      RETENTION_DAYS: 1
      NTFY_URL: ""
    ports:
      - "127.0.0.1:8090:8088"
    volumes:
      - /:/host:ro
      - ./data-dev/agent:/data
    user: "0:0"
    pid: host
    read_only: true
    # The host's /run holds the control sockets of Docker, containerd, systemd and others.
    # A read-only mount doesn't stop connecting to a socket, so hide it: root here must not reach them.
    tmpfs: [/tmp, /host/run]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    networks: [default, docker-api]
    depends_on: [docker-proxy]

  docker-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: gaugery-dev-docker-proxy
    environment:
      CONTAINERS: 1
      POST: 0
      EVENTS: 0                                    # not needed
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: [/run, /tmp]              # the proxy writes its config at start
    networks: [docker-api]

  # Start/stop/restart only (create, exec and everything else stay refused). Runs only with
  # COMPOSE_PROFILES=actions in .env, together with ALLOW_CONTAINER_ACTIONS on the agent.
  docker-actions:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: gaugery-dev-docker-actions
    restart: unless-stopped
    environment:
      POST: 1                  # POSTs pass the first gate, but the only ones that match an allow rule
      CONTAINERS: 0            # are these three; with CONTAINERS=0, create and exec hit the final deny
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      EVENTS: 0
      PING: 0
      VERSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: [/run, /tmp]
    networks: [docker-api]

volumes:
  hub-data-dev:
  agent-socket-dev:

networks:
  docker-api:
    internal: true
