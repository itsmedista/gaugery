<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gaugery: a ring gauge drawn as a G. The arc is the reading, the amber needle is the G's bar. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2633"/>
      <stop offset="1" stop-color="#0B1118"/>
    </linearGradient>
    <linearGradient id="arc" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35D0BA"/>
      <stop offset="1" stop-color="#4FA8FF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="1.5"/>
  <!-- the empty part of the dial -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="6"/>
  <!-- the reading: from the top right, around the left, to the right middle -->
  <path d="M44.2 17.4A19 19 0 1 0 51 32" fill="none" stroke="url(#arc)" stroke-width="6" stroke-linecap="round"/>
  <!-- the needle, which is also the bar of the G -->
  <path d="M32 28.6 45.2 30.6Q47 32 45.2 33.4L32 35.4Z" fill="#F5B942"/>
  <circle cx="32" cy="32" r="3.9" fill="#F5B942"/>
</svg>
