<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Monitorr</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gauge.css">
<link rel="stylesheet" href="forms.css">
<style>
:root{
  --bg:#0D141C; --panel:#131C26; --panel2:#18232F; --raise:#1D2A38;
  --line:#1F2C3A; --line2:#2A3A4C;
  --text:#DCE4EC; --muted:#8395A9; --faint:#5A6B7E;
  --teal:#35D0BA; --sky:#4FA8FF; --amber:#F5B942;
  --ok:#3DD68C; --warn:#F5B942; --crit:#FF5A5F;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 24px;background:rgba(13,20,28,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.word{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.word b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.word span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.btn{border:1px solid var(--line2);background:var(--panel);padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--panel2)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:12.5px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}

main{max-width:1320px;margin:0 auto;padding:24px}

/* Every card is the same size: fixed sections inside, and every grid row as tall as the tallest. */
.grid{--min:300px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min),1fr));grid-auto-rows:1fr;gap:16px}
.grid[data-density=compact]{--min:250px;gap:12px}

/* server card: green when nothing is wrong, red when it has alerts or can't be reached */
.card{--c:var(--faint);position:relative;min-width:0;display:flex;flex-direction:column;gap:12px;padding:16px 16px 12px;border-radius:14px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 11%,var(--panel)) 0%,var(--panel) 55%);
  border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));transition:border-color .3s,background .3s,translate .15s,box-shadow .2s}
.card::before{content:"";position:absolute;inset:0 0 auto;height:3px;border-radius:14px 14px 0 0;background:var(--c)}
.card[data-s=ok]{--c:var(--ok)}
.card[data-s=alert],.card[data-s=offline]{--c:var(--crit)}
.card:hover{translate:0 -2px;border-color:color-mix(in srgb,var(--c) 70%,var(--line))}
.card a.open{position:absolute;inset:0;border-radius:14px;z-index:1}
.card .head{display:flex;align-items:center;gap:6px;height:40px}
.card .name{flex:1;min-width:0}
.card .name b{display:block;font-size:15.5px;font-weight:600;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .name>span{display:block;font-size:12.5px;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;line-height:17px;color:var(--sky);background:color-mix(in srgb,var(--sky) 14%,transparent);vertical-align:2px}
.badge{flex:none;display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;border-radius:999px;font-size:12.5px;font-weight:600;
  color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.badge b{display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--c);color:var(--bg);font-size:12px}
.card[data-s=offline] .badge,.card[data-s=pending] .badge{padding-left:10px}

/* controls above the card's link: grip, pin mark, menu */
.ctl{position:relative;z-index:2;flex:none;display:grid;place-items:center;width:26px;height:28px;border:0;border-radius:7px;background:none;color:var(--faint);cursor:pointer}
.ctl:hover{color:var(--text);background:color-mix(in srgb,var(--text) 8%,transparent)}
.grip{margin-left:-8px;width:18px;cursor:grab;touch-action:none;opacity:.55}
.card:hover .grip,.grip:focus-visible{opacity:1}
.pin{flex:none;color:var(--sky);display:grid;place-items:center;width:18px}

.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card .gauge{padding:10px 4px 8px}
.card .gauge .glabel{font-size:12px}
.card[data-s=offline] .gauges{opacity:.4;filter:grayscale(1)}

/* alert lines: always room for three plus "and N more", so footers line up */
.alerts{display:flex;flex-direction:column;gap:4px;height:calc(4 * 19px + 3 * 4px);overflow:hidden;font-size:13px;line-height:19px}
.alerts div{display:flex;gap:8px;align-items:center;min-width:0}
.alerts div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alerts i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.alerts i.critical{background:var(--crit)}
.alerts .fine{color:var(--muted)} .alerts .fine i{background:var(--ok)}
.alerts .more{color:var(--faint);font-size:12px;padding-left:15px}
.foot{margin-top:auto;display:flex;align-items:center;gap:10px;height:30px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden}
.foot span{overflow:hidden;text-overflow:ellipsis}

/* compact: same parts, smaller; still identical from card to card */
.grid[data-density=compact] .card{gap:10px;padding:14px 14px 12px}
.grid[data-density=compact] .gauge{padding:6px 2px 5px;border-radius:8px}
.grid[data-density=compact] .gauge svg{max-width:62px}
.grid[data-density=compact] .gauge .glabel{font-size:11px;margin-top:-4px}
.grid[data-density=compact] .alerts{height:19px}
.grid[data-density=compact] .foot{display:none}
.grid[data-density=compact] .tag{font-size:0;width:7px;height:7px;padding:0;margin-left:7px;background:var(--sky);vertical-align:3px}  /* keep the name readable */

.add{display:grid;place-items:center;align-content:center;gap:10px;min-height:120px;border:1.5px dashed var(--line2);border-radius:14px;background:none;color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s}
.add:hover{color:var(--text);border-color:var(--teal)}
.add svg{width:34px;height:34px;padding:8px;border-radius:10px;background:var(--panel2)}

/* dragging */
.card.dragging{z-index:20;cursor:grabbing;translate:none;box-shadow:0 24px 50px -12px rgba(0,0,0,.7),0 0 0 1px color-mix(in srgb,var(--sky) 60%,transparent);transition:box-shadow .2s}
.card.dragging .grip{cursor:grabbing}
.grid.is-dragging .card:not(.dragging){opacity:.85}
.grid.is-dragging, .grid.is-dragging *{user-select:none}

/* card menu */
.menu{position:absolute;z-index:30;min-width:200px;padding:5px;border-radius:10px;background:var(--raise);border:1px solid var(--line2);box-shadow:0 16px 40px -12px rgba(0,0,0,.7)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:7px;background:none;font-size:13px;text-align:left;cursor:pointer}
.menu button:hover:not(:disabled),.menu button:focus-visible{background:var(--panel2);outline:none}
.menu button:disabled{color:var(--faint);cursor:default}
.menu button svg{flex:none;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line2);margin:5px 4px}
.menu .danger{color:var(--crit)} .menu .danger svg{color:var(--crit)}

@media (max-width:640px){
  .top{padding:10px 16px;gap:10px} main{padding:16px}
  .top .btn span,.seg .lbl{display:none}
  .grid,.grid[data-density=compact]{grid-template-columns:minmax(0,1fr)}
  .grip{opacity:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <img src="icon.svg" width="34" height="34" alt="">
  <div class="word"><b>Monitorr</b><span id="summary">Loading servers…</span></div>
  <span class="spacer"></span>
  <div class="seg" id="density" role="group" aria-label="Card size">
    <button data-d="detailed" aria-pressed="true" title="Detailed cards"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M2 9h12"/></svg><span class="lbl">Detailed</span></button>
    <button data-d="compact" aria-pressed="false" title="Compact cards"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg><span class="lbl">Compact</span></button>
  </div>
  <button class="btn primary" id="add-btn"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11"/></svg><span>Add server</span></button>
  <button class="btn" id="logout" title="Sign out" aria-label="Sign out" hidden>
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1H6M10.5 11 13.5 8l-3-3M13.5 8H6"/></svg>
  </button>
</header>

<main>
  <div class="grid" id="grid" data-density="detailed"></div>
  <p class="sr" id="announce" aria-live="polite"></p>
</main>

<div class="menu" id="menu" role="menu" hidden></div>

<dialog id="dlg">
  <form id="add-form" method="dialog">
    <h2>Add a server</h2>
    <p class="hint">Install the Monitorr agent on it first: <code>sudo ./install.sh --agent</code>. The installer prints the address and token to paste here.</p>
    <label for="f-name">Name</label>
    <input id="f-name" name="name" placeholder="NAS" required maxlength="60">
    <label for="f-url">Address</label>
    <input id="f-url" name="url" placeholder="http://100.64.0.12:8088" required spellcheck="false" autocapitalize="none">
    <label for="f-token">Agent token</label>
    <input id="f-token" name="token" required spellcheck="false" autocapitalize="none" autocomplete="off">
    <p class="err" id="f-err" role="alert"></p>
    <div class="row">
      <button type="button" class="btn" id="f-cancel">Cancel</button>
      <button class="btn primary" id="f-go">Connect and add</button>
    </div>
  </form>
</dialog>

<script src="gauge.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmtDur = s => { s = Math.max(0, s); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; };
const ago = t => { const s = Date.now() / 1000 - t; return s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`; };
const svg = (d, w = 14) => `<svg width="${w}" height="${w}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  grip: '<circle cx="6" cy="4" r=".9" fill="currentColor"/><circle cx="10" cy="4" r=".9" fill="currentColor"/><circle cx="6" cy="8" r=".9" fill="currentColor"/><circle cx="10" cy="8" r=".9" fill="currentColor"/><circle cx="6" cy="12" r=".9" fill="currentColor"/><circle cx="10" cy="12" r=".9" fill="currentColor"/>',
  more: '<circle cx="3.5" cy="8" r="1" fill="currentColor"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="12.5" cy="8" r="1" fill="currentColor"/>',
  pin: '<path d="M9.5 2.5 13.5 6.5 11 7.5 8.5 10 8.8 12.8 3.2 7.2 6 7.5 8.5 5z"/><path d="M5.5 10.5 2.5 13.5"/>',
  up: '<path d="M8 13V3M4 7l4-4 4 4"/>', down: '<path d="M8 3v10M4 9l4 4 4-4"/>',
  open: '<path d="M9 3h4v4M13 3 7.5 8.5M12 9.5V13H3V4h3.5"/>', trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/>',
};

async function api(u, opts) {
  const r = await fetch(u, {cache: 'no-store', ...opts});
  if (r.status === 401) { location.href = 'login.html'; throw new Error('signed out'); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `Request failed (${r.status})`);
  return body;
}

/* ---------------- layout: order, pins and card size, saved on the hub ---------------- */
let prefs = {order: [], pinned: [], density: 'detailed'}, servers = [], dragging = null;
let saveTimer = null;
function savePrefs() {
  clearTimeout(saveTimer);
  const ids = new Set(servers.map(s => s.id));  // forget servers that were removed
  prefs.order = prefs.order.filter(id => ids.has(id)); prefs.pinned = prefs.pinned.filter(id => ids.has(id));
  saveTimer = setTimeout(() => api('api/prefs/overview', {method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(prefs)}).catch(e => console.error(e)), 300);
}
const isPinned = id => prefs.pinned.includes(id);
// pinned first; then the saved order; servers the layout doesn't know yet go last
function arrange(list) {
  const pos = new Map(prefs.order.map((id, i) => [id, i]));
  return list.map((s, i) => [s, i]).sort(([a, ai], [b, bi]) =>
    (isPinned(b.id) - isPinned(a.id)) || ((pos.get(a.id) ?? 1e6 + ai) - (pos.get(b.id) ?? 1e6 + bi))).map(([s]) => s);
}
function setDensity(d, save) {
  prefs.density = d; $('#grid').dataset.density = d;
  for (const b of $('#density').children) b.setAttribute('aria-pressed', b.dataset.d === d);
  if (save) { savePrefs(); render(); }
}

/* ---------------- cards ---------------- */
// Card gauges use the shared Gauge (gauge.js), with the same labels and thresholds as a server's page.
const prev = new Map();  // last reading per gauge, so the ring animates from there after each redraw
let pending = [];
function gauge(key, label, v, th) {
  const ok = typeof v === 'number', f = ok ? Math.min(1, Math.max(0, v / 100)) : 0;
  const from = prev.get(key) ?? {frac: 0, level: 'ok'};
  const now = {frac: f, level: ok ? Gauge.level(f, th) : 'ok', num: ok ? Math.round(v) : '–', unit: ok ? '%' : '',
    title: `${label}: ${ok ? v.toFixed(1) + '%' : 'no data'}`};
  prev.set(key, now); pending.push([key, now]);
  return Gauge.html({id: 'g-' + key, label, sub: null, ...from});
}
function settleGauges(root) {
  void root.offsetWidth;  // commit the starting fill, or there is nothing to animate from
  for (const [key, now] of pending) { const el = document.getElementById('g-' + key); if (el) Gauge.set(el, now); }
  pending = [];
}
const sevCls = s => s === 'critical' ? 'critical' : 'warning';  // only known words go into class names
function stateOf(srv) {
  const n = srv.alerts.critical + srv.alerts.warning;
  return srv.online === false ? 'offline' : n ? 'alert' : !srv.summary ? 'pending' : 'ok';
}
function cardHTML(srv, state) {
  // srv.alerts = the server's own alerts plus its service checks' alerts (merged by the hub)
  const sm = srv.summary, A = srv.alerts, n = A.critical + A.warning, sv = srv.services;
  const compact = prefs.density === 'compact', name = esc(srv.name);
  const badge = state === 'offline' ? '<span class="badge">Offline</span>'
    : state === 'pending' ? '<span class="badge">Starting</span>'
    : `<span class="badge" title="${n} active alert${n === 1 ? '' : 's'}"><b>${n}</b>${n === 1 ? 'alert' : 'alerts'}</span>`;
  const sub = sm ? `${esc(sm.hostname)} · ${esc(sm.os)}` : esc(srv.url || '');
  let alerts;
  if (state === 'offline') alerts = `<div><i class="critical"></i><span>${esc(srv.error)}</span></div>`;
  else if (!n) alerts = `<div class="fine"><i></i><span>All checks passing</span></div>`;
  else if (compact) alerts = `<div><i class="${sevCls(A.top[0].severity)}"></i><span>${esc(A.top[0].title)}${n > 1 ? ` <span class="more">+${n - 1} more</span>` : ''}</span></div>`;
  else {
    alerts = A.top.map(a => `<div><i class="${sevCls(a.severity)}"></i><span>${esc(a.title)}</span></div>`).join('');
    if (n > A.top.length) alerts += `<div class="more">and ${n - A.top.length} more</div>`;
  }
  const meta = state === 'offline' ? (sm ? `Last seen ${ago(sm.t)}` : 'Never reached')
    : [sm && `Up ${fmtDur(sm.uptime)}`, sv.total && `${sv.up}/${sv.total} services up`,
       sm?.containers && `${sm.containers.running}/${sm.containers.total} containers`].filter(Boolean).join(' · ');
  return `<a class="open" href="server.html?id=${encodeURIComponent(srv.id)}" aria-label="Open ${name}" title="${esc(meta)}"></a>
    <div class="head">
      <button class="ctl grip" aria-label="Move ${name}. Drag, or use the arrow keys." title="Drag to move">${svg(I.grip)}</button>
      <div class="name"><b>${name}${srv.local ? '<span class="tag" title="This server">This server</span>' : ''}</b><span>${sub}</span></div>
      ${isPinned(srv.id) ? `<span class="pin" title="Pinned to the top" aria-label="Pinned">${svg(I.pin, 13)}</span>` : ''}
      ${badge}
      <button class="ctl more" aria-label="Options for ${name}" aria-haspopup="menu" title="Options">${svg(I.more)}</button>
    </div>
    <div class="gauges">${gauge(srv.id + '-cpu', 'CPU', sm?.cpu)}${gauge(srv.id + '-ram', 'RAM', sm?.mem)}${gauge(srv.id + '-disk', compact ? 'Disk' : 'Fullest drive', sm?.disk, [.85, .95])}</div>
    <div class="alerts">${alerts}</div>
    <div class="foot"><span>${esc(meta)}</span></div>`;
}

// Cards keep their element between refreshes, so a drag or an open menu survives the 5-second update
// and moved cards can glide to their new place.
const cardEls = new Map();
const addTile = Object.assign(document.createElement('button'), {className: 'add', id: 'add-card',
  innerHTML: `${svg('<path d="M8 3v10M3 8h10"/>', 16)}Add a server`});
function render(animate) {
  if (dragging) return;  // never move cards under the user's pointer; the next refresh catches up
  const grid = $('#grid'), list = arrange(servers);
  const act = document.activeElement, focusCard = act?.closest?.('.card')?.dataset.id, focusCls = act?.classList?.[1];
  const apply = () => {
    const seen = new Set();
    list.forEach((srv, i) => {
      let el = cardEls.get(srv.id);
      if (!el) { el = document.createElement('article'); el.className = 'card'; el.dataset.id = srv.id; cardEls.set(srv.id, el); }
      el.dataset.s = stateOf(srv); el.innerHTML = cardHTML(srv, el.dataset.s);
      if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null);
      seen.add(srv.id);
    });
    for (const [id, el] of cardEls) if (!seen.has(id)) { el.remove(); cardEls.delete(id); }
    grid.appendChild(addTile);
  };
  animate ? flip(apply) : apply();
  settleGauges(grid);
  if (focusCard && focusCls) cardEls.get(focusCard)?.querySelector('.' + focusCls)?.focus({preventScroll: true});
}
// FLIP: remember where cards were, change the DOM, then slide each from its old spot to its new one.
function flip(mutate) {
  const els = [...$('#grid').children].filter(e => !e.classList.contains('dragging'));
  const before = new Map(els.map(e => [e, e.getBoundingClientRect()]));
  mutate();
  for (const e of els) {
    const a = before.get(e), b = e.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) continue;
    e.style.transition = 'none'; e.style.transform = `translate(${dx}px,${dy}px)`;
    requestAnimationFrame(() => { e.style.transition = 'transform .22s cubic-bezier(.2,.7,.3,1)'; e.style.transform = ''; });
    setTimeout(() => { e.style.transition = ''; }, 260);
  }
}

let timer = null;
async function refresh() {
  clearTimeout(timer);
  try {
    servers = await api('api/servers');
    const bad = servers.filter(s => s.online === false || s.alerts.critical + s.alerts.warning).length;
    $('#summary').textContent = `${servers.length} server${servers.length === 1 ? '' : 's'} · ` + (bad ? `${bad} need${bad === 1 ? 's' : ''} attention` : 'all healthy');
    render();
    const title = bad ? `(${bad}) Monitorr` : 'Monitorr';
    if (document.title !== title) document.title = title;
  } catch (e) {
    if (e.message === 'signed out') return;
    $('#summary').textContent = "Can't reach Monitorr. Retrying…";
  }
  timer = setTimeout(refresh, 5000);
}

/* ---------------- moving and pinning ---------------- */
const announce = msg => { $('#announce').textContent = msg; };
function canMove(id, dir) {
  const ids = arrange(servers).map(s => s.id), j = ids.indexOf(id) + dir;
  return j >= 0 && j < ids.length && isPinned(ids[j]) === isPinned(id);  // pinned and unpinned cards stay in their own group
}
function move(id, dir) {
  if (!canMove(id, dir)) return;
  const ids = arrange(servers).map(s => s.id), i = ids.indexOf(id);
  [ids[i], ids[i + dir]] = [ids[i + dir], ids[i]];
  prefs.order = ids; savePrefs(); render(true);
  announce(`${servers.find(s => s.id === id).name} moved to position ${i + dir + 1} of ${ids.length}`);
}
function togglePin(id) {
  prefs.pinned = isPinned(id) ? prefs.pinned.filter(x => x !== id) : [...prefs.pinned, id];
  prefs.order = arrange(servers).map(s => s.id);
  savePrefs(); render(true);
  announce(`${servers.find(s => s.id === id).name} ${isPinned(id) ? 'pinned to the top' : 'unpinned'}`);
}

// drag by the grip; works with mouse, pen and touch (pointer events)
const grid = $('#grid');
function follow(x, y) {
  const d = dragging; d.el.style.transform = 'none';
  const r = d.el.getBoundingClientRect();
  d.el.style.transform = `translate(${x - d.ox - r.left}px,${y - d.oy - r.top}px)`;
}
grid.addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g || e.button > 0) return;
  e.preventDefault(); closeMenu();
  const el = g.closest('.card'), r = el.getBoundingClientRect();
  g.setPointerCapture(e.pointerId);
  dragging = {el, id: el.dataset.id, ox: e.clientX - r.left, oy: e.clientY - r.top, moved: false};
  el.classList.add('dragging'); grid.classList.add('is-dragging');
});
grid.addEventListener('pointermove', e => {
  const d = dragging; if (!d) return;
  d.moved = true; follow(e.clientX, e.clientY);
  const over = document.elementsFromPoint(e.clientX, e.clientY).map(n => n.closest?.('.card')).find(c => c && c !== d.el);
  if (over && isPinned(over.dataset.id) === isPinned(d.id)) {
    const cards = [...grid.querySelectorAll('.card')], from = cards.indexOf(d.el), to = cards.indexOf(over);
    flip(() => over[from < to ? 'after' : 'before'](d.el));
    follow(e.clientX, e.clientY);
  }
  if (e.clientY < 80) scrollBy(0, -14); else if (e.clientY > innerHeight - 60) scrollBy(0, 14);
});
function drop() {
  const d = dragging; if (!d) return;
  dragging = null;
  d.el.classList.remove('dragging'); grid.classList.remove('is-dragging');
  d.el.style.transition = 'transform .2s cubic-bezier(.2,.7,.3,1)'; d.el.style.transform = '';
  setTimeout(() => { d.el.style.transition = ''; }, 220);
  if (d.moved) {
    prefs.order = [...grid.querySelectorAll('.card')].map(c => c.dataset.id); savePrefs();
    const ids = prefs.order; announce(`${servers.find(s => s.id === d.id)?.name} moved to position ${ids.indexOf(d.id) + 1} of ${ids.length}`);
  }
}
grid.addEventListener('pointerup', drop);
grid.addEventListener('pointercancel', drop);
grid.addEventListener('keydown', e => {
  const g = e.target.closest('.grip'); if (!g) return;
  const dir = {ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1}[e.key];
  if (dir) { e.preventDefault(); move(g.closest('.card').dataset.id, dir); }
});

/* ---------------- card menu ---------------- */
const menu = $('#menu'); let menuFor = null;
function openMenu(btn, id) {
  const srv = servers.find(s => s.id === id); if (!srv) return;
  menuFor = {id, btn};
  const item = (act, icon, label, ok = true, cls = '') => `<button role="menuitem" data-act="${act}" class="${cls}"${ok ? '' : ' disabled'}>${svg(icon)}${label}</button>`;
  menu.innerHTML = item('pin', I.pin, isPinned(id) ? 'Unpin' : 'Pin to the top')
    + item('earlier', I.up, 'Move earlier', canMove(id, -1)) + item('later', I.down, 'Move later', canMove(id, 1))
    + item('open', I.open, 'Open dashboard')
    + (srv.local ? '' : '<hr>' + item('remove', I.trash, 'Remove server…', true, 'danger'));
  menu.hidden = false;
  const r = btn.getBoundingClientRect();
  menu.style.top = `${r.bottom + scrollY + 6}px`;
  menu.style.left = `${Math.max(8, Math.min(r.right - menu.offsetWidth, innerWidth - menu.offsetWidth - 8)) + scrollX}px`;
  btn.setAttribute('aria-expanded', 'true');
  menu.querySelector('button:not(:disabled)').focus();
}
function closeMenu(refocus) {
  if (menu.hidden) return;
  menu.hidden = true;
  const card = menuFor && cardEls.get(menuFor.id);
  if (refocus) card?.querySelector('.more')?.focus();
  menuFor = null;
}
grid.addEventListener('click', e => {
  if (e.target.closest('#add-card')) return openAdd();
  const b = e.target.closest('.more');
  if (b) { e.preventDefault(); const id = b.closest('.card').dataset.id; menuFor?.id === id ? closeMenu() : openMenu(b, id); }
});
menu.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b || b.disabled) return;
  const id = menuFor.id, srv = servers.find(s => s.id === id); closeMenu(true);
  if (b.dataset.act === 'pin') togglePin(id);
  else if (b.dataset.act === 'earlier') move(id, -1);
  else if (b.dataset.act === 'later') move(id, 1);
  else if (b.dataset.act === 'open') location.href = 'server.html?id=' + encodeURIComponent(id);
  else if (b.dataset.act === 'remove') {
    if (!confirm(`Stop monitoring ${srv.name}? Its service checks are deleted too. The agent keeps running on that server until you uninstall it.`)) return;
    try { await api('api/servers/' + encodeURIComponent(id), {method: 'DELETE'}); } catch (err) { alert(err.message); }
    refresh();
  }
});
menu.addEventListener('keydown', e => {
  const items = [...menu.querySelectorAll('button:not(:disabled)')], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(true); });
document.addEventListener('pointerdown', e => { if (!menu.hidden && !menu.contains(e.target) && !e.target.closest('.more')) closeMenu(); });

$('#density').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.d !== prefs.density) setDensity(b.dataset.d, true); });

/* ---------------- add a server ---------------- */
const dlg = $('#dlg'), form = $('#add-form');
function openAdd() { form.reset(); $('#f-err').textContent = ''; dlg.showModal(); $('#f-name').focus(); }
$('#add-btn').addEventListener('click', openAdd);
$('#f-cancel').addEventListener('click', () => dlg.close());
form.addEventListener('submit', async e => {
  e.preventDefault();
  const go = $('#f-go'); go.disabled = true; go.textContent = 'Connecting…'; $('#f-err').textContent = '';
  try {
    await api('api/servers', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: $('#f-name').value, url: $('#f-url').value, token: $('#f-token').value})});
    dlg.close(); refresh();
  } catch (err) { $('#f-err').textContent = err.message; }
  go.disabled = false; go.textContent = 'Connect and add';
});

$('#logout').addEventListener('click', async () => { await fetch('api/logout', {method: 'POST'}).catch(() => {}); location.href = 'login.html'; });
api('api/info').then(i => { $('#logout').hidden = !i.auth; }).catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
api('api/prefs/overview').then(p => { prefs = p; }).catch(() => {}).finally(() => { setDensity(prefs.density); refresh(); });
</script>
</body>
