services:
  monitorr:
    build: .
    image: monitorr:latest
    container_name: monitorr
    restart: unless-stopped

    # The monitor must see the host, not its own container:
    network_mode: host     # real network interfaces (and the page is served on the host's IP)
    pid: host              # host processes and the host's mount table
    privileged: true       # SMART access to your drives
    # Prefer not to use privileged? Remove it and list your disks instead
    # (you'll also lose SMART on some NVMe drives):
    # cap_add: [SYS_RAWIO, SYS_ADMIN]
    # devices: ["/dev/sda", "/dev/sdb", "/dev/sdc"]

    volumes:
      - /:/host:ro,rslave                               # every host mount, read-only
      # Container stats, logs and actions. Note: ":ro" doesn't limit what Docker's API allows;
      # anything that can reach this socket controls Docker. ALLOW_* below decide what the page exposes.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data                                    # history database

    environment:
      # Login. Put AUTH_PASSWORD_HASH=... in a .env file next to this one (it's gitignored).
      # Make the hash with: docker compose run --rm monitorr python app.py --hash-password
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      SESSION_DAYS: 30
      # Host names this answers to, comma separated (e.g. monitorr.lan,100.64.0.5). Blocks DNS rebinding.
      ALLOWED_HOSTS: ""
      # Agent mode (another Monitorr watches this server): AGENT_TOKEN=... in .env.
      # Make one with: docker compose run --rm monitorr python app.py --new-token
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      # Container logs on the dashboard, and start/stop/restart buttons (logged and sent to ntfy).
      ALLOW_LOGS: "true"
      ALLOW_CONTAINER_ACTIONS: "false"
      # Listen address. Put your Tailscale IP here (tailscale ip -4) to keep it on the tailnet.
      HOST: 0.0.0.0
      PORT: 8088
      SAMPLE_INTERVAL: 2
      RETENTION_DAYS: 14
      # Phone alerts via ntfy, e.g. https://ntfy.sh/your-private-topic (empty = off)
      NTFY_URL: ""
      NTFY_TOKEN: ""
      # Mount points to hide, comma separated
      IGNORE_MOUNTS: ""
      ALERT_CPU: 90
      ALERT_MEM: 90
      ALERT_DISK_WARN: 85
      ALERT_DISK_CRIT: 95
      ALERT_TEMP_WARN: 80
      ALERT_TEMP_CRIT: 90
      ALERT_FILL_DAYS: 14
